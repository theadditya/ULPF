id: "palo_alto_traffic"
name: "Palo Alto Networks PAN-OS Traffic Parser"
vendor: "Palo Alto Networks"
product: "PAN-OS Next-Gen Firewall"
version: "10.2.0"
format: "csv"
strip_syslog_header: true

parser_config:
  delimiter: ","
  columns:
    - "future_use_1"
    - "receive_time"
    - "serial"
    - "type"
    - "subtype"
    - "future_use_2"
    - "time_generated"
    - "src_ip"
    - "dst_ip"
    - "nat_src_ip"
    - "nat_dst_ip"
    - "rule_name"
    - "src_user"
    - "dst_user"
    - "app"
    - "vsys"
    - "src_zone"
    - "dst_zone"
    - "inbound_if"
    - "outbound_if"
    - "log_profile"
    - "future_use_3"
    - "session_id"
    - "repeat_count"
    - "src_port"
    - "dst_port"
    - "nat_src_port"
    - "nat_dst_port"
    - "flags"
    - "protocol"
    - "action"
    - "bytes"
    - "bytes_sent"
    - "bytes_received"
    - "packets"
    - "start_time"
    - "elapsed"
    - "category"

mapping:
  "src_endpoint.ip": "src_ip"
  "src_endpoint.port": "src_port"
  "src_endpoint.zone": "src_zone"
  "dst_endpoint.ip": "dst_ip"
  "dst_endpoint.port": "dst_port"
  "dst_endpoint.zone": "dst_zone"
  "connection_info.protocol": "protocol"
  "connection_info.session_id": "session_id"
  "traffic.bytes_in": "bytes_received"
  "traffic.bytes_out": "bytes_sent"
  "traffic.total_bytes": "bytes"
  "traffic.duration_ms": "elapsed"
  "disposition.action": "action"
  "app_name": "app"
  "timestamp": "time_generated"

value_maps:
  "disposition.action":
    "allow": "Allowed"
    "deny": "Blocked"
    "drop": "Dropped"
    "reset-both": "Reset"
    "reset-client": "Reset"
    "reset-server": "Reset"
